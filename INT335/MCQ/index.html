<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INT335 Design Thinking – MCQ Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f6; --surface:#ffffff; --ink:#14213d; --muted:#5b6882; --line:#d5dbe6;
  --accent:#2447d6; --accent-ink:#ffffff; --accent-soft:#e3e9fc;
  --ok:#14804a; --ok-soft:#dff3e8; --bad:#c0392b; --bad-soft:#fbe5e2;
  --easy:#2f9e6b; --mod:#d49a1a; --hard:#c0392b; --mix:#6a4fc9;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#172038; --ink:#e8ecf6; --muted:#97a3bd; --line:#2a3555;
    --accent:#7c97ff; --accent-ink:#0e1424; --accent-soft:#222e57;
    --ok:#52d196; --ok-soft:#16362a; --bad:#ff8a7a; --bad-soft:#3d1f1c;
    --easy:#52d196; --mod:#f0bb4a; --hard:#ff8a7a; --mix:#a590ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#172038; --ink:#e8ecf6; --muted:#97a3bd; --line:#2a3555;
  --accent:#7c97ff; --accent-ink:#0e1424; --accent-soft:#222e57;
  --ok:#52d196; --ok-soft:#16362a; --bad:#ff8a7a; --bad-soft:#3d1f1c;
  --easy:#52d196; --mod:#f0bb4a; --hard:#ff8a7a; --mix:#a590ff;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;font-size:16px}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.brand{font-size:14px;color:var(--muted);font-weight:500}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--muted)}
.ghost:hover{border-color:var(--accent);color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:600;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--accent)}

/* home */
.hero{padding:28px 0 20px}
.hero h1{font-size:clamp(30px,6vw,44px)}
.hero p{color:var(--muted);margin:10px 0 0;max-width:56ch}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:22px 0 8px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.opts label{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--accent)}
.sets{display:grid;gap:12px;margin-top:18px}
.set{display:grid;grid-template-columns:6px 1fr auto;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;width:100%}
.set:hover{border-color:var(--accent)}
.set .bar{background:var(--c)}
.set .body{padding:16px 18px}
.set h3{font-size:20px}
.set .meta{color:var(--muted);font-size:14px;margin-top:4px}
.set .best{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 18px;font-size:13px;color:var(--muted);white-space:nowrap}
.set .best b{font-size:20px;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 10px;font-size:14px;color:var(--muted)}
.qhead .title{font-weight:600;color:var(--ink)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);padding:0}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.dot.done{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.dot.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.dot.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--c);margin-bottom:8px}
.q{font-size:clamp(19px,3.4vw,23px);font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:500;line-height:1.35;margin:0 0 18px}
.choices{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch .l{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.ch.sel{border-color:var(--accent);background:var(--accent-soft)}
.ch.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ok .l{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.bad{border-color:var(--bad);background:var(--bad-soft)}
.ch.bad .l{background:var(--bad);border-color:var(--bad);color:#fff}
.ch:disabled{cursor:default}
.exp{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);font-size:15px}
.exp strong{display:block;margin-bottom:2px}
.exp.good strong{color:var(--ok)} .exp.wrong strong{color:var(--bad)}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* results */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:10px 0 4px}
.score .n{font-family:"Bricolage Grotesque",sans-serif;font-size:64px;font-weight:700;line-height:1}
.score .of{color:var(--muted);font-size:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
.stat{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-family:"Bricolage Grotesque",sans-serif}
.stat span{font-size:13px;color:var(--muted)}
.rev{margin-top:12px}
.rev details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.rev summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;list-style:none;font-size:15px}
.rev summary::-webkit-details-marker{display:none}
.rev .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.mk.ok{background:var(--ok)} .mk.bad{background:var(--bad)}
.rev .det{padding:0 14px 14px 46px;font-size:14.5px;color:var(--muted)}
.rev .det p{margin:4px 0}
.rev .det b{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.filter{display:flex;gap:8px;margin:18px 0 8px}
.filter button{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:14px}
.filter button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.set{grid-template-columns:6px 1fr}.set .best{display:none}.card{padding:18px 14px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- QUESTION BANK ----------
   Each item: [question, [optA, optB, optC, optD], correctIndex(0-3), explanation]
   To add more sets, push a new object into SETS. */
const SETS = [
{
 id:"easy1", name:"Easy – Set 1", level:"Easy", color:"var(--easy)", mins:45,
 qs:[
["Which mode of thinking is logical, structured, sequential, and analytical?",["Diffuse mode","Focused mode","Abstract mode","Random mode"],1,"Focused mode concentrates attention on a specific task using established neural pathways."],
["What does the letter 'V' stand for in the VARK learning framework?",["Verbal","Visual","Virtual","Vocal"],1,"In VARK, V stands for Visual preference (diagrams, charts, images)."],
["Seeing a paper clip strictly as a tool to hold papers together is an example of:",["Functional fixedness","Brainstorming","Diffuse thinking","Empathy"],0,"Functional fixedness limits an object's use to its conventional purpose."],
["Which stage of the Stanford d.school framework focuses on generating a large quantity of ideas?",["Empathize","Define","Ideate","Test"],2,"Ideation is the phase dedicated to expanding options and creating ideas."],
["The IDEO Human-Centred Design framework has three overlapping lenses: Desirability, Feasibility, and:",["Profitability","Viability","Sustainability","Adaptability"],1,"The three IDEO lenses are Desirability, Feasibility, and Viability."],
["In SCAMPER, what does the letter 'S' stand for?",["Solve","Substitute","Simplify","Structure"],1,"S stands for Substitute (replacing materials, processes, or components)."],
["What type of thinking is used to narrow down choices and select the single best option?",["Divergent thinking","Convergent thinking","Lateral thinking","Abstract thinking"],1,"Convergent thinking evaluates and selects the best option through logic."],
["The primary goal during the initial phase of brainstorming is:",["Quality of ideas","Quantity of ideas","Cost estimation","Technical feasibility"],1,"Brainstorming prioritizes quantity before quality."],
["In the AEIOU observation framework, what does the 'E' represent?",["Emotion","Environment","Evaluation","Empathy"],1,"AEIOU = Activities, Environments, Interactions, Objects, Users."],
["Which study technique has been shown by research to reliably improve learning retention?",["Matching instruction to VARK preference","Retrieval practice","Cramming overnight","Passive re-reading"],1,"Retrieval practice, spacing, and interleaving replicate positive results."],
["What is the first stage in the Stanford d.school Design Thinking model?",["Define","Prototype","Empathize","Ideate"],2,"Empathize is stage 1, focused on understanding user needs."],
["A product or idea that is novel but delivers no real-world value is classified as:",["Innovation","Invention without innovation","Market success","Feasible prototype"],1,"Invention creates a new thing; innovation occurs only when value is delivered."],
["The technique of sketching 8 distinct ideas in 8 minutes is known as:",["SCAMPER","Crazy 8s","Mind Mapping","Reverse Thinking"],1,"Crazy 8s requires 8 distinct sketches in 8 minutes under pressure."],
["\"How Might We\" (HMW) statements reframe problems into:",["Constraints","Opportunities","Final solutions","Budget limits"],1,"HMW statements convert problems into open opportunities for innovation."],
["What type of problem has clear goals, strict constraints, and one correct answer?",["Ill-defined problem","Wicked problem","Well-defined problem","Abstract problem"],2,"Well-defined problems have clear parameters and single solutions (e.g., equations)."],
["In SCAMPER, removing an unnecessary feature to simplify a product uses which prompt?",["Adapt","Eliminate","Modify","Reverse"],1,"Eliminate focuses on removing non-essential parts."],
["Which thinking mode allows the brain to make broader, relaxed connections between ideas?",["Focused mode","Diffuse mode","Linear mode","Analytical mode"],1,"Diffuse mode is relaxed, exploratory, and associative."],
["What does 'K' stand for in the VARK framework?",["Knowledge","Kinetic","Kinesthetic","Key learning"],2,"K represents Kinesthetic (hands-on, practical learning)."],
["The principle behind the improv brainstorming rule \"Yes, and...\" is to:",["Critique every idea immediately","Accept a contribution and build upon it","Reject wild ideas","Focus on budget constraints first"],1,"\"Yes, and...\" extends lines of thought without blocking them."],
["What is a persona in Design Thinking?",["A real, specific customer","A fictional character based on user research patterns","A stereotype generated without data","The company CEO"],1,"Personas represent user archetypes built on empirical research data."],
["In SCAMPER, combining two separate objects like a pen and a USB drive is:",["Substitute","Combine","Adapt","Reverse"],1,"Combine merges two existing products or concepts."],
["What matrix plots options along Relevance and Feasibility axes?",["2×2 Prioritisation Matrix","SCAMPER Matrix","Empathy Map","Mind Map"],0,"The 2×2 matrix sorts ideas into Quick Wins, Prioritise, Consider, and Avoid."],
["Asking \"How can we make this problem worse?\" is part of:",["SCAMPER","Reverse Thinking / Inversion","Mind Mapping","Linear analysis"],1,"Reverse thinking asks how to cause failure to uncover hidden solutions."],
["A prototype built early in the design process should ideally be:",["Highly expensive and final","Simple, quick, and cheap to test","Fully coded and functional","Market-ready"],1,"Early prototyping focuses on low-cost rapid learning from feedback."],
["The IDEO lens assessing \"Can we actually build this technically?\" is:",["Desirability","Feasibility","Viability","Utility"],1,"Feasibility evaluates technical capability and resources."],
["Which of these is a cognitive block to creativity?",["Open-mindedness","Premature judgment","Divergent thinking","User empathy"],1,"Premature judgment rejects ideas before they can be fully explored."],
["Affinity clustering organizes scattered ideas by:",["Alphabetical order","Grouping them into thematic clusters","Author's seniority","Financial cost"],1,"Affinity clustering groups related sticky notes by underlying themes."],
["Divergent thinking is best used during which phase?",["Final decision making","Generating alternative ideas","Writing financial reports","Final product launch"],1,"Divergent thinking expands options and generates alternatives."],
["Biomimicry (e.g., Velcro inspired by plant burrs) falls under which SCAMPER letter?",["S (Substitute)","A (Adapt)","M (Modify)","R (Reverse)"],1,"Adapt involves borrowing mechanisms or patterns from nature or other industries."],
["In traditional Waterfall development, user feedback typically occurs:",["Continuously throughout","At the very beginning only","At the end of the linear pipeline","Never"],2,"Waterfall is linear; feedback comes late, making changes costly."]
 ]
},
{
 id:"easy2", name:"Easy – Set 2", level:"Easy", color:"var(--easy)", mins:45,
 qs:[
["Which thinking mode operates along established neural pathways to perform step-by-step tasks?",["Diffuse mode","Focused mode","Random mode","Associative mode"],1,"Focused mode is structured and concentrated on specific tasks like solving equations or writing code."],
["What does the letter 'A' stand for in the VARK framework?",["Applied","Auditory","Action-oriented","Analytical"],1,"Auditory preferences involve listening and discussion."],
["Viewing a matchbox strictly as storage for matches rather than a wall candle holder illustrates:",["Divergent thinking","Functional fixedness","Brainstorming","Empathy"],1,"Functional fixedness limits an object to its traditional purpose."],
["Which Stanford d.school stage involves synthesizing observations into a focused problem statement?",["Empathize","Define","Prototype","Test"],1,"The Define stage pinpoints the core problem from empathy research."],
["In the IDEO framework, evaluating whether an idea is economically sustainable checks its:",["Desirability","Feasibility","Viability","Accessibility"],2,"Viability asks if a solution is financially and operationally sustainable."],
["In SCAMPER, what does 'C' represent?",["Create","Combine","Compare","Classify"],1,"Combine merges two or more ideas, features, or processes."],
["What type of thinking expands options and explores divergent possibilities?",["Convergent thinking","Divergent thinking","Linear thinking","Sequential thinking"],1,"Divergent thinking focuses on generating many original ideas."],
["Alex Osborn's foundational rules for brainstorming emphasize:",["Immediate criticism","Suspending judgment and aiming for quantity","Selecting one idea early","Enforcing strict budgets"],1,"Osborn established deferring judgment and prioritizing quantity."],
["In the AEIOU observation framework, 'O' stands for:",["Operations","Objects","Options","Outcomes"],1,"Objects are the physical items present in the observed setting."],
["Which study strategy is proven to replicate strong retention results?",["Matching instruction to VARK preference","Spacing","Cramming","Passive highlighting"],1,"Retrieval practice, spacing, and interleaving are evidence-backed study strategies."],
["Stage 4 of the Stanford d.school framework is:",["Ideate","Prototype","Test","Define"],1,"Prototype is stage 4, where tangible representations are built."],
["An idea that generates original concepts but is never created or used is best described as:",["Innovation","Creativity / Idea stage","Market launch","Final product"],1,"Creativity produces ideas; invention creates the thing; innovation delivers value."],
["What technique uses branches radiating from a central topic to organize ideas visually?",["SCAMPER","Mind Mapping","Crazy 8s","Inversion"],1,"Mind maps expand outward from a central concept using keywords and sub-branches."],
["What question phrasing turns traditional problems into innovation opportunities?",["Why did this break?","How Might We?","Who is to blame?","How much will this cost?"],1,"HMW statements shift focus from describing problems to imagining possibilities."],
["What type of problem has unclear goals and many possible solutions?",["Well-defined problem","Ill-defined problem","Linear equation","Deterministic system"],1,"Ill-defined problems lack straightforward paths and unambiguous answers."],
["Borrowing Velcro design from plant burrs applies which SCAMPER prompt?",["Substitute","Adapt","Eliminate","Reverse"],1,"Adapt involves borrowing ideas or mechanisms from nature or other domains."],
["Dmitri Mendeleev's arrangement of the periodic table after stepping away illustrates:",["Pure focused effort","Diffuse mode processing after focused struggle","Random memory loss","Linear engineering"],1,"Diffuse thinking reorganizes material previously loaded through focused study."],
["What does 'R' stand for in the VARK framework?",["Rational","Reading/Writing","Reflective","Research"],1,"R represents Reading/Writing preference."],
["Rejecting an idea ten seconds into a brainstorm violates which principle?",["Deferring judgment","Setting a strict budget","Speeding up convergence","Code optimization"],0,"Premature judgment shuts down idea generation."],
["An empathy map typically contains four quadrants: Says, Thinks, Does, and:",["Buys","Feels","Codes","Markets"],1,"The four standard empathy map quadrants are Says, Thinks, Does, and Feels."],
["In SCAMPER, replacing petrol engines with electric batteries is:",["Combine","Substitute","Reverse","Minify"],1,"Replacing components or energy sources uses Substitute."],
["Prioritizing ideas based on Impact vs. Effort uses which tool?",["Impact-Effort Matrix","Empathy Map","Mind Map","SCAMPER Table"],0,"The Impact-Effort matrix categorizes top priorities, strategic goals, and items to avoid."],
["Inversion thinking focuses on:",["Pursuing direct success","Identifying what to avoid and how to fail","Increasing project cost","Copying competitors"],1,"Inversion asks what failure vectors to avoid."],
["Testing prototypes with users provides feedback to refine the solution in an:",["Linear pipeline","Iterative loop","Static database","One-way workflow"],1,"Design Thinking is inherently iterative rather than linear."],
["The IDEO lens assessing \"Do people actually want this?\" is:",["Feasibility","Desirability","Viability","Profitability"],1,"Desirability measures human need and appeal."],
["Rejecting ideas before exploring them fully is known as:",["Premature judgment","The expertise trap","Conformity","Diffuse thinking"],0,"Premature judgment is a cognitive block that stifles creative options."],
["Grouping scattered sticky notes under common themes is:",["Mind mapping","Affinity clustering","Inversion","Reverse thinking"],1,"Affinity diagrams organize large volumes of ideas into logical groups."],
["Convergent thinking is used to:",["Expand options endlessly","Evaluate and select the single best option","Ignore feasibility","Avoid decision making"],1,"Convergence narrows choices to make final selections."],
["Changing a process order from store shopping to online ordering illustrates:",["Substitute","Reverse / Rearrange","Eliminate","Minify"],1,"Changing sequence or workflow order uses Reverse/Rearrange."],
["Human-Centred Design places which entity at the core of all decisions?",["Technology stack","The user","Shareholder profit","Legal counsel"],1,"HCD revolves around understanding and solving human user needs."]
 ]
},
{
 id:"easy3", name:"Easy – Set 3", level:"Easy", color:"var(--easy)", mins:45,
 qs:[
["Solving mathematical proofs step-by-step uses:",["Focused mode","Diffuse mode","Intuitive mode","Unconscious mode"],0,"Step-by-step logical analytical work is focused mode."],
["A student who learns best through practical, hands-on experience has a preference for:",["Visual","Kinesthetic","Auditory","Read/Write"],1,"Kinesthetic preferences lean on physical doing and experimentation."],
["The Candle Problem illustrates breaking:",["Linear logic","Functional fixedness","Mathematical constraints","Market costs"],1,"Using the matchbox as a candle stand breaks functional fixedness."],
["The final stage of the Stanford d.school process is:",["Prototype","Test","Define","Ideate"],1,"Testing evaluates prototypes with real users."],
["The overlapping point of Desirability, Feasibility, and Viability in IDEO HCD yields:",["Invention","Innovation","Prototype","Persona"],1,"Genuine innovation lies at the intersection of all three lenses."],
["In SCAMPER, 'M' stands for:",["Measure","Modify (Magnify / Minify)","Manage","Model"],1,"Modify alters size, shape, appearance, or features."],
["Generating 30 ideas in 8 minutes prioritizes:",["Quality over quantity","Quantity over quality","Financial viability","Coding accuracy"],1,"Rapid sprints focus on maximizing idea count."],
["Alex Osborn coined which classic group technique:",["Waterfall","Brainstorming","SCAMPER","Mind Mapping"],1,"Alex Osborn created the foundational rules of brainstorming."],
["In AEIOU, 'I' represents:",["Ideas","Interactions","Insights","Innovations"],1,"Interactions track exchanges between people, systems, and objects."],
["A study strategy that interleaves topics improves:",["Long-term retention","Typing speed","Visual style score","Drawing ability"],0,"Interleaving is an evidence-backed cognitive learning technique."],
["Stage 3 of the Stanford d.school framework is:",["Empathize","Ideate","Test","Define"],1,"Stage 3 is Ideate, focused on generating solution options."],
["The first telephone created by Alexander Graham Bell is classified as an:",["Incremental improvement","Invention","Empathy map","Ill-defined task"],1,"Creating something entirely new that did not exist before is invention."],
["What technique uses a 7-letter checklist to spark creative changes?",["VARK","SCAMPER","AEIOU","HMW"],1,"SCAMPER provides seven prompt letters for idea modification."],
["Statements written as \"How might we...\" aim to:",["Limit project scope","Frame open opportunities for user-centered solutions","Assign blame for bugs","Calculate exact costs"],1,"HMW frames problems as constructive design challenges."],
["Complex social challenges like climate change are categorized as:",["Well-defined problems","Wicked problems","Linear equations","Simple puzzles"],1,"Wicked problems are interconnected, systemic, and lack right/wrong answers."],
["In SCAMPER, removing buttons to make a touchscreen device uses:",["Combine","Eliminate","Reverse","Adapt"],1,"Eliminating elements simplifies products."],
["Relaxed thinking during a walk that triggers sudden insight uses:",["Focused mode","Diffuse mode","Linear mode","Strict calculation"],1,"Diffuse thinking connects broad ideas when attention relaxes."],
["Preference for learning via charts, diagrams, and videos aligns with:",["Auditory","Visual","Kinesthetic","Read/Write"],1,"Visual preference centers on diagrams and spatial displays."],
["Following conventional thinking solely to fit in with a group is:",["Conformity","Premature judgment","Expertise trap","Fear of failure"],0,"Conformity forces alignment with group norms."],
["A target archetype representing a recurring behavioral pattern is a:",["Survey","Persona","Codebase","Constraint"],1,"Personas capture shared goals, behaviors, and frustrations."],
["Merging a pen and a laser pointer into one device uses SCAMPER's:",["Substitute","Combine","Reverse","Eliminate"],1,"Combine joins functions into a single product."],
["A weighted matrix helps teams:",["Generate 100 raw ideas","Evaluate and screen ideas against prioritized criteria","Draw wireframes","Conduct user interviews"],1,"Weighted matrices support objective decision-making."],
["Asking \"How can we make library queues as slow as possible?\" uses:",["SCAMPER","Reverse thinking","Mind mapping","Affinity clustering"],1,"Reverse thinking explores deliberate failure to identify improvements."],
["Testing early low-fidelity prototypes is beneficial because:",["Early failure is cheaper than late failure","High fidelity is impossible","Users prefer paper over code","It skips the empathy phase"],0,"Early low-cost testing prevents expensive late-stage changes."],
["Technical feasibility evaluates whether:",["Users want the product","Available technology can support building the product","The product makes an immediate profit","The name is catchy"],1,"Feasibility checks technical capability and construction practicalities."],
["Hesitation to share wild ideas due to criticism stems from:",["Fear of failure","The expertise trap","Diffuse mode","High confidence"],0,"Fear of failure and judgment hold people back from sharing ideas."],
["The primary goal of affinity grouping is to:",["Discard 90% of ideas immediately","Organize ideas thematically to reveal hidden patterns","Rank team members","Calculate project costs"],1,"Affinity clustering tames large idea sets into logical groups."],
["Divergent thinking is characterized as:",["Analytical and narrow","Creative and exploratory","Strict and rule-bound","Single-answer focused"],1,"Divergent thinking expands options through flexible, creative exploration."],
["SCAMPER's 'P' prompt stands for:",["Plan","Put to another use","Prototype","Prioritize"],1,"'P' asks how a product can be repurposed in new contexts."],
["Linear sequential product development is known as:",["Human-Centred Design","Waterfall methodology","Agile iteration","Design Sprint"],1,"Waterfall completes each step linearly before moving to the next."]
 ]
},
{
 id:"easy4", name:"Easy – Set 4", level:"Easy", color:"var(--easy)", mins:45,

/* ---------- STATE & HELPERS ---------- */
const app = document.getElementById("app");
const L = ["A","B","C","D"];
let S = null; // current attempt
let settings = { shuffle:true, exam:false, timer:true };
let best = {};
try { best = JSON.parse(localStorage.getItem("int335_best")||"{}"); } catch(e){}
try { const s = JSON.parse(localStorage.getItem("int335_settings")||"null"); if(s) settings = Object.assign(settings,s); } catch(e){}
function saveBest(){ try{ localStorage.setItem("int335_best", JSON.stringify(best)); }catch(e){} }
function saveSettings(){ try{ localStorage.setItem("int335_settings", JSON.stringify(settings)); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
let tick=null;

function build(set, onlyIdx){
  let items = set.qs.map((q,i)=>({i,q}));
  if(onlyIdx) items = items.filter(x=>onlyIdx.includes(x.i));
  const order = settings.shuffle ? shuffle(items) : items;
  return {
    set, exam:settings.exam, idx:0, start:Date.now(), elapsed:0, done:false,
    qs: order.map(({i,q})=>{
      let opts = q[1].map((t,k)=>({t,ok:k===q[2]}));
      if(settings.shuffle) opts = shuffle(opts);
      return { src:i, q:q[0], opts, exp:q[3], picked:null };
    })
  };
}

/* ---------- HOME ---------- */
function home(){
  clearInterval(tick); S=null;
  app.innerHTML = `
  <div class="top"><span class="brand">INT335 · Design Thinking</span>
    <button class="ghost" id="theme">Toggle theme</button></div>
  <div class="hero">
    <h1>MCQ practice question bank</h1>
    <p>${SETS.reduce((n,s)=>n+s.qs.length,0)} questions across ${SETS.length} sets. Pick a set, answer, and review what you missed.</p>
  </div>
  <div class="opts" role="group" aria-label="Practice options">
    <label><input type="checkbox" id="o-shuffle" ${settings.shuffle?"checked":""}> Shuffle answer order</label>
    <label><input type="checkbox" id="o-exam" ${settings.exam?"checked":""}> Exam mode (no feedback until the end)</label>
    <label><input type="checkbox" id="o-timer" ${settings.timer?"checked":""}> Show timer</label>
  </div>
  <div class="sets">
    ${SETS.map(s=>{
      const b=best[s.id];
      return `<button class="set" data-id="${s.id}" style="--c:${s.color}">
        <span class="bar"></span>
        <span class="body"><h3>${s.name}</h3>
          <div class="meta">${s.level} · ${s.qs.length} questions · suggested ${s.mins} min</div></span>
        <span class="best">${b!=null?`Best<b>${b}/${s.qs.length}</b>`:"Not attempted"}</span>
      </button>`;}).join("")}
  </div>`;
  document.getElementById("theme").onclick=toggleTheme;
  for(const [id,key] of [["o-shuffle","shuffle"],["o-exam","exam"],["o-timer","timer"]]){
    document.getElementById(id).onchange=e=>{settings[key]=e.target.checked;saveSettings();};
  }
  app.querySelectorAll(".set").forEach(b=>b.onclick=()=>{
    S=build(SETS.find(s=>s.id===b.dataset.id)); startTimer(); quiz();
  });
}
function toggleTheme(){
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
}

/* ---------- QUIZ ---------- */
function startTimer(){
  clearInterval(tick);
  tick=setInterval(()=>{
    if(!S||S.done) return;
    S.elapsed=Math.floor((Date.now()-S.start)/1000);
    const t=document.getElementById("clock"); if(t) t.textContent=fmt(S.elapsed);
  },1000);
}
function quiz(){
  const q=S.qs[S.idx], n=S.qs.length;
  const answered=S.qs.filter(x=>x.picked!==null).length;
  const locked = !S.exam && q.picked!==null;
  app.innerHTML = `
  <div class="top"><span class="brand">${S.set.name}${S.exam?" · Exam mode":""}</span>
    <button class="ghost" id="quit">Quit</button></div>
  <div class="qhead"><span class="title">Question ${S.idx+1} of ${n}</span>
    <span>${answered}/${n} answered${settings.timer?` · <span id="clock">${fmt(S.elapsed)}</span>`:""}</span></div>
  <div class="prog" aria-hidden="true"><i style="width:${answered/n*100}%"></i></div>
  <div class="nav" role="navigation" aria-label="Question navigator">
    ${S.qs.map((x,i)=>{
      let c="dot"; if(i===S.idx)c+=" cur";
      if(x.picked!==null){ if(S.exam) c+=" done"; else c+= x.opts[x.picked].ok?" ok":" bad"; }
      return `<button class="${c}" data-i="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`;}).join("")}
  </div>
  <div class="card" style="--c:${S.set.color}">
    <span class="tag">${S.set.level}</span>
    <p class="q">${esc(q.q)}</p>
    <div class="choices">
      ${q.opts.map((o,k)=>{
        let c="ch";
        if(locked){ if(o.ok)c+=" ok"; else if(q.picked===k)c+=" bad"; }
        else if(q.picked===k) c+=" sel";
        return `<button class="${c}" data-k="${k}" ${locked?"disabled":""}><span class="l">${L[k]}</span><span>${esc(o.t)}</span></button>`;
      }).join("")}
    </div>
    ${locked?`<div class="exp ${q.opts[q.picked].ok?"good":"wrong"}">
      <strong>${q.opts[q.picked].ok?"Correct":"Incorrect — correct answer: "+L[q.opts.findIndex(o=>o.ok)]}</strong>${esc(q.exp)}</div>`:""}
  </div>
  <div class="actions">
    <button class="btn sec" id="prev" ${S.idx===0?"disabled":""}>Previous</button>
    ${S.idx<n-1
      ? `<button class="btn" id="next">${(!S.exam&&q.picked===null)?"Skip":"Next"}</button>`
      : `<button class="btn" id="finish">Finish &amp; see results</button>`}
  </div>`;
  app.querySelectorAll(".dot").forEach(d=>d.onclick=()=>{S.idx=+d.dataset.i;quiz();});
  app.querySelectorAll(".ch").forEach(c=>c.onclick=()=>{
    q.picked=+c.dataset.k; quiz();
  });
  const p=document.getElementById("prev"); if(p)p.onclick=()=>{S.idx--;quiz();};
  const nx=document.getElementById("next"); if(nx)nx.onclick=()=>{S.idx++;quiz();};
  const f=document.getElementById("finish"); if(f)f.onclick=()=>{
    const left=S.qs.filter(x=>x.picked===null).length;
    if(left && !confirm(left+" question(s) unanswered. Finish anyway?")) return;
    finish();
  };
  document.getElementById("quit").onclick=()=>{ if(confirm("Quit this attempt? Progress will be lost.")) home(); };
  window.scrollTo({top:0});
}

/* ---------- RESULTS ---------- */
function finish(){
  S.done=true; S.elapsed=Math.floor((Date.now()-S.start)/1000); clearInterval(tick);
  const total=S.qs.length, correct=S.qs.filter(x=>x.picked!==null&&x.opts[x.picked].ok).length;
  const full = S.qs.length===S.set.qs.length;
  if(full && (best[S.set.id]==null || correct>best[S.set.id])){ best[S.set.id]=correct; saveBest(); }
  S.score=correct; results("all");
}
function results(filter){
  const total=S.qs.length, correct=S.score;
  const skipped=S.qs.filter(x=>x.picked===null).length, wrong=total-correct-skipped;
  const pct=Math.round(correct/total*100);
  const verdict = pct>=85?"Excellent work.":pct>=65?"Solid. Review the misses below.":pct>=40?"Getting there. Re-read the explanations.":"Start with the explanations, then retry.";
  const list=S.qs.map((x,i)=>({x,i})).filter(({x})=>{
    const ok=x.picked!==null&&x.opts[x.picked].ok;
    return filter==="all"||(filter==="wrong"&&!ok);
  });
  app.innerHTML=`
  <div class="top"><span class="brand">${S.set.name} · Results</span>
    <button class="ghost" id="theme">Toggle theme</button></div>
  <div class="score"><span class="n">${correct}</span><span class="of">/ ${total} · ${pct}%</span></div>
  <p style="margin:0;color:var(--muted)">${verdict}</p>
  <div class="stats">
    <div class="stat"><b style="color:var(--ok)">${correct}</b><span>Correct</span></div>
    <div class="stat"><b style="color:var(--bad)">${wrong}</b><span>Incorrect</span></div>
    <div class="stat"><b>${skipped}</b><span>Skipped</span></div>
    <div class="stat"><b>${fmt(S.elapsed)}</b><span>Time taken</span></div>
  </div>
  <div class="row" style="margin-top:0">
    <button class="btn" id="retry" ${correct===total?"disabled":""}>Retry ${total-correct} missed</button>
    <button class="btn sec" id="again">Restart set</button>
    <button class="btn sec" id="home">All sets</button>
  </div>
  <div class="filter">
    <button data-f="all" class="${filter==="all"?"on":""}">All answers</button>
    <button data-f="wrong" class="${filter==="wrong"?"on":""}">Missed only</button>
  </div>
  <div class="rev">
    ${list.length?list.map(({x,i})=>{
      const ok=x.picked!==null&&x.opts[x.picked].ok;
      const ci=x.opts.findIndex(o=>o.ok);
      return `<details ${ok?"":"open"}><summary><span class="mk ${ok?"ok":"bad"}">${ok?"✓":"✕"}</span><span>${i+1}. ${esc(x.q)}</span></summary>
        <div class="det">
          <p><b>Your answer:</b> ${x.picked===null?"Skipped":L[x.picked]+") "+esc(x.opts[x.picked].t)}</p>
          ${ok?"":`<p><b>Correct answer:</b> ${L[ci]}) ${esc(x.opts[ci].t)}</p>`}
          <p>${esc(x.exp)}</p></div></details>`;}).join(""):`<p style="color:var(--muted)">Nothing missed. Full marks.</p>`}
  </div>`;
  document.getElementById("theme").onclick=toggleTheme;
  document.getElementById("home").onclick=home;
  document.getElementById("again").onclick=()=>{S=build(S.set);startTimer();quiz();};
  document.getElementById("retry").onclick=()=>{
    const ids=S.qs.filter(x=>!(x.picked!==null&&x.opts[x.picked].ok)).map(x=>x.src);
    S=build(S.set,ids);startTimer();quiz();
  };
  app.querySelectorAll(".filter button").forEach(b=>b.onclick=()=>results(b.dataset.f));
  window.scrollTo({top:0});
}
home();
</script>
